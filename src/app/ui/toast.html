<div class="pointer-events-none fixed inset-x-0 bottom-24 z-[110] flex flex-col items-center gap-2 px-4 md:bottom-6">
  @for (toast of toasts(); track toast.id) {
    <div class="pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-2xl bg-black px-3 py-3 text-white shadow-lg">
      <img [src]="toast.image" alt="" class="h-12 w-12 shrink-0 rounded-lg object-cover" />
      <div class="min-w-0 flex-1">
        <p class="text-xs font-medium text-white/70">{{ 'PRODUCT.ADDED' | translate }}</p>
        <p class="truncate text-sm font-medium">{{ toast.name | productLabel: toast.productId }}</p>
      </div>
      <a routerLink="/cart" class="shrink-0 text-xs font-semibold text-primary" (click)="dismiss(toast.id)">
        {{ 'NAV.CART' | translate }}
      </a>
    </div>
  }
</div>
