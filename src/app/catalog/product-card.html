<article class="group">
  <div class="relative aspect-square overflow-hidden rounded-md bg-black/5 shadow-none transition duration-300 group-hover:shadow-md">
    <a [routerLink]="['/product', product().id]" class="block h-full">
      <img
        [src]="product().image"
        [alt]="product().name | productLabel: product().id"
        class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.03]"
      />
    </a>
    @if (product().compareAt) {
      <span class="absolute start-3 top-3 rounded-full bg-primary px-2.5 py-1 text-[11px] font-medium tracking-wide text-white">
        {{ 'PRODUCT.SALE' | translate }}
      </span>
    }
    <button
      type="button"
      class="absolute bottom-3 end-3 inline-flex h-10 w-10 items-center justify-center rounded-full bg-white text-black shadow-sm transition md:opacity-0 md:group-hover:opacity-100"
      [attr.aria-label]="(added() ? 'PRODUCT.ADDED' : 'PRODUCT.ADD') | translate"
      (click)="addToCart($event)"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25h9.75m-9.75 0L6.106 5.272M7.5 14.25l-.94 3.76A1.125 1.125 0 0 0 7.644 19.5h10.212" />
      </svg>
    </button>
  </div>
  <a [routerLink]="['/product', product().id]" class="mt-3 block truncate text-sm">{{ product().name | productLabel: product().id }}</a>
  <p class="mt-1 flex items-baseline gap-2">
    <span class="text-sm font-semibold">EGP {{ product().price | number:'1.0-0' }}</span>
    @if (product().compareAt; as previous) {
      <span class="text-sm text-black/40 line-through">EGP {{ previous | number:'1.0-0' }}</span>
    }
  </p>
</article>
