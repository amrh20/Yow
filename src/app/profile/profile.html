<div class="mx-auto flex w-full max-w-3xl flex-col gap-6">
  <section class="rounded-lg border border-black/10 bg-white p-6 md:p-8">
    <h1 class="text-xl font-semibold tracking-tight">{{ 'PROFILE.TITLE' | translate }}</h1>

    @if (user(); as account) {
      <dl class="mt-6 grid gap-5 sm:grid-cols-2">
        <div>
          <dt class="text-xs tracking-wide text-black/45">{{ 'PROFILE.NAME' | translate }}</dt>
          <dd class="mt-1 text-sm font-medium">{{ account.fullName }}</dd>
        </div>
        <div>
          <dt class="text-xs tracking-wide text-black/45">{{ 'PROFILE.MOBILE' | translate }}</dt>
          <dd class="mt-1 text-sm font-medium">{{ account.mobile }}</dd>
        </div>
      </dl>
      <button
        type="button"
        class="mt-8 h-10 rounded-md border border-black/15 px-4 text-sm"
        (click)="logout()"
      >
        {{ 'PROFILE.SIGN_OUT' | translate }}
      </button>
    } @else {
      <p class="mt-4 text-sm text-black/60">{{ 'PROFILE.GUEST' | translate }}</p>
      <a
        routerLink="/login"
        class="mt-6 inline-flex h-11 items-center rounded-md bg-primary px-5 text-sm font-medium text-white"
      >
        {{ 'AUTH.SIGN_IN' | translate }}
      </a>
    }
  </section>

  <app-address-list />
</div>
