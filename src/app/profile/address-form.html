<form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="block sm:col-span-2">
      <span class="text-sm text-black/70">{{ 'PROFILE.TITLE_FIELD' | translate }}</span>
      <input
        type="text"
        formControlName="title"
        [placeholder]="'PROFILE.TITLE_PLACEHOLDER' | translate"
        class="mt-1.5 h-11 w-full rounded-md border border-black/15 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-black"
      />
    </label>
    <label class="block sm:col-span-2">
      <span class="text-sm text-black/70">{{ 'PROFILE.STREET' | translate }}</span>
      <input
        type="text"
        formControlName="street"
        class="mt-1.5 h-11 w-full rounded-md border border-black/15 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-black"
      />
    </label>
    <label class="block">
      <span class="text-sm text-black/70">{{ 'PROFILE.BUILDING' | translate }}</span>
      <input
        type="text"
        formControlName="building"
        class="mt-1.5 h-11 w-full rounded-md border border-black/15 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-black"
      />
    </label>
    <label class="block">
      <span class="text-sm text-black/70">{{ 'PROFILE.FLOOR' | translate }}</span>
      <input
        type="text"
        formControlName="floor"
        class="mt-1.5 h-11 w-full rounded-md border border-black/15 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-black"
      />
    </label>
    <label class="block sm:col-span-2">
      <span class="text-sm text-black/70">{{ 'PROFILE.CITY' | translate }}</span>
      <input
        type="text"
        formControlName="city"
        class="mt-1.5 h-11 w-full rounded-md border border-black/15 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-black"
      />
    </label>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit" class="h-11 rounded-md bg-primary px-5 text-sm font-medium text-white">
      {{ (address() ? 'PROFILE.SAVE' : 'PROFILE.ADD') | translate }}
    </button>
    <button
      type="button"
      class="h-11 rounded-md border border-black/15 px-5 text-sm"
      (click)="cancelled.emit()"
    >
      {{ 'PROFILE.CANCEL' | translate }}
    </button>
  </div>
</form>
