<div class="fixed inset-0 z-[200] flex items-center justify-center bg-black/50 p-4" role="dialog" aria-modal="true" [attr.aria-label]="'LOCATION.TITLE' | translate">
  <div class="w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-xl">
    <span class="mb-4 inline-block rounded-full bg-red-50 p-4 text-primary">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-8 w-8" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
      </svg>
    </span>
    <h2 class="mb-2 text-xl font-bold">{{ 'LOCATION.TITLE' | translate }}</h2>
    <p class="mb-6 text-sm text-gray-500">{{ 'LOCATION.BODY' | translate }}</p>
    <button type="button" class="mb-3 w-full rounded-xl bg-primary py-3 font-semibold text-white" (click)="allow()">
      {{ 'LOCATION.ALLOW' | translate }}
    </button>
    <button type="button" class="w-full bg-transparent py-2 font-medium text-gray-500 hover:text-black" (click)="dismiss()">
      {{ 'LOCATION.LATER' | translate }}
    </button>
  </div>
</div>
