<section class="mx-auto max-w-lg py-10 text-center">
  <p class="text-xs tracking-[0.22em] text-black/45">{{ 'SUCCESS.EYEBROW' | translate }}</p>
  <h1 class="mt-3 text-3xl font-semibold tracking-tight">{{ 'SUCCESS.TITLE' | translate }}</h1>
  <p class="mt-3 text-sm leading-6 text-black/60">
    <span class="font-medium text-black">#{{ orderId() }}</span>
    {{ 'SUCCESS.BODY' | translate }}
  </p>

  @if (tracking()) {
    <p class="mt-6 text-sm text-black/70">#{{ orderId() }} {{ 'SUCCESS.PREPARING' | translate }}</p>
  }

  <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
    <a routerLink="/shop" class="inline-flex h-11 items-center rounded-md bg-primary px-6 text-sm font-medium text-white">
      {{ 'SUCCESS.CONTINUE' | translate }}
    </a>
    <button
      type="button"
      class="inline-flex h-11 items-center rounded-md border border-black/15 px-6 text-sm"
      (click)="trackOrder()"
    >
      {{ 'SUCCESS.TRACK' | translate }}
    </button>
  </div>
</section>
