<section class="mx-auto w-full max-w-md rounded-lg border border-black/10 bg-white p-8">
  <h1 class="text-xl font-semibold tracking-tight">{{ 'AUTH.RESET' | translate }}</h1>
  <p class="mt-1 text-sm text-black/50">{{ 'AUTH.RESET_HINT' | translate }}</p>

  <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
    <label class="block">
      <span class="text-sm text-black/70">{{ 'AUTH.MOBILE' | translate }}</span>
      <input
        type="tel"
        formControlName="mobile"
        autocomplete="tel"
        class="mt-1.5 h-11 w-full rounded-md border border-black/15 bg-white px-3 text-sm outline-none focus:ring-2 focus:ring-black"
      />
    </label>

    @if (sent()) {
      <p class="text-sm text-black/70">{{ 'AUTH.SENT' | translate }}</p>
    }
    @if (unknown()) {
      <p class="text-sm text-primary">{{ 'AUTH.UNKNOWN' | translate }}</p>
    }

    <button type="submit" class="h-11 w-full rounded-md bg-primary text-sm font-medium text-white">
      {{ 'AUTH.SEND' | translate }}
    </button>
  </form>

  <p class="mt-6 text-sm">
    <a routerLink="/login" class="text-black/60 hover:text-black">{{ 'AUTH.BACK' | translate }}</a>
  </p>
</section>
